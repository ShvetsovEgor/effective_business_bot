services:
  web:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "80"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/bot.sqlite
      CHECKPOINT_PATH: /app/data/checkpoints.sqlite
      DOCUMENTS_PATH: /app/templates
      NODE_EXTRA_CA_CERTS: /app/certs/russian_trusted_root_ca.pem
      YANDEX_CLOUD_API_TOKEN: ${YANDEX_AI_STUDIO_API_KEY}
      YANDEX_CLOUD_FOLDER_ID: ${YANDEX_CLOUD_FOLDER_ID:-b1gv2rfr13cpst5o42jr}
    volumes:
      - bot-data:/app/data
    restart: unless-stopped

  bot-legacy:
    build: .
    command: ["python", "-u", "bot.py"]
    env_file:
      - .env
    profiles:
      - legacy-bot
    restart: unless-stopped

volumes:
  bot-data:
